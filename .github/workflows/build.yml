name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      configure_only:
        description: Stop after configure
        type: boolean
        default: false
      include_core:
        description: Also validate the core-only variant (release validation)
        type: boolean
        default: false
      zero_baseline:
        description: Build HotSpot Zero for macOS arm64 and run the benchmark baseline
        type: boolean
        default: false
      benchmark:
        description: Run the Simulator benchmark (two passes, opposite order)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-api:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile documented Swift embedding API
        run: |
          python3 - <<'PY'
          import pathlib, subprocess
          example = pathlib.Path("docs/EMBEDDING.md").read_text().split("```swift\n", 1)[1].split("```", 1)[0]
          source = pathlib.Path("swift-embedding-smoke.swift")
          source.write_text(example)
          try:
              sdk = subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-path"], text=True).strip()
              subprocess.run(["xcrun", "swiftc", "-typecheck", "-target", "arm64-apple-ios15.0-simulator",
                              "-sdk", sdk, "-I", "Sources/OpenJ9Kit/include", str(source)], check=True)
          finally:
              source.unlink()
          PY

  jdk:
    name: jdk (${{ matrix.sdk }}, ${{ matrix.desktop }})
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sdk: [iphonesimulator, iphoneos]
        desktop: ${{ fromJSON((github.ref_type == 'tag' || inputs.include_core) && '["headless","core"]' || '["headless"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install autoconf ccache cmake bash make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk ${{ matrix.sdk }} --show-sdk-path

      - name: Fetch and patch sources
        run: scripts/fetch-sources.sh

      - name: Archive corresponding runtime sources
        if: github.ref_type == 'tag' && matrix.sdk == 'iphoneos' && matrix.desktop == 'headless'
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/OpenJ9-iOS-source.tar.gz" \
            Sources Samples docs scripts patches README.md sources.env work/src/jdk
          (cd "$RUNNER_TEMP" && shasum -a 256 OpenJ9-iOS-source.tar.gz >OpenJ9-iOS-source.tar.gz.sha256)

      - name: Upload corresponding runtime sources
        if: github.ref_type == 'tag' && matrix.sdk == 'iphoneos' && matrix.desktop == 'headless'
        uses: actions/upload-artifact@v4
        with:
          name: OpenJ9-iOS-source
          path: |
            ${{ runner.temp }}/OpenJ9-iOS-source.tar.gz
            ${{ runner.temp }}/OpenJ9-iOS-source.tar.gz.sha256
          if-no-files-found: error

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: work/ccache
          key: ccache-${{ matrix.sdk }}-${{ matrix.desktop }}-${{ hashFiles('sources.env', 'patches/*.patch') }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.sdk }}-${{ matrix.desktop }}-${{ hashFiles('sources.env', 'patches/*.patch') }}-
            ccache-${{ matrix.sdk }}-

      - name: Configure and build
        env:
          CCACHE_DIR: ${{ github.workspace }}/work/ccache
          CCACHE_MAXSIZE: 3G
          CCACHE_COMPRESS: '1'
        run: |
          args=()
          [[ "${{ matrix.desktop }}" != core ]] || args+=(--disable-java-desktop)
          [[ "${{ inputs.configure_only }}" != true ]] || args+=(--configure-only)
          scripts/build-jdk.sh ${{ matrix.sdk }} "${args[@]}"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/ccache
          key: ccache-${{ matrix.sdk }}-${{ matrix.desktop }}-${{ hashFiles('sources.env', 'patches/*.patch') }}-${{ github.run_id }}

      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p logs
          conf=work/src/jdk/build/ios-${{ matrix.sdk }}
          [[ "${{ matrix.desktop }}" != core ]] || conf="$conf-core"
          cp "$conf/config.log" logs/ 2>/dev/null || true
          cp "$conf/spec.gmk" logs/ 2>/dev/null || true
          cp "$conf/toolchain.cmake" logs/ 2>/dev/null || true
          cp -R "$conf/make-support/failure-logs" logs/ 2>/dev/null || true
          cp "$conf/build.log" logs/ 2>/dev/null || true
          find "$conf/vm" -maxdepth 2 -name 'CMake*.log' -exec cp {} logs/ \; 2>/dev/null || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.sdk }}-${{ matrix.desktop }}
          path: logs
          if-no-files-found: ignore

      - name: Upload jmods
        if: ${{ !inputs.configure_only }}
        uses: actions/upload-artifact@v4
        with:
          name: jmods-${{ matrix.sdk }}-${{ matrix.desktop }}
          path: work/src/jdk/build/ios-${{ matrix.sdk }}${{ matrix.desktop == 'core' && '-core' || '' }}/images/jmods
          if-no-files-found: error

  package:
    needs: jdk
    if: ${{ !inputs.configure_only }}
    runs-on: macos-15
    name: package (${{ matrix.desktop }})
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON((github.ref_type == 'tag' || inputs.include_core) && '["headless","core"]' || '["headless"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen

      - uses: actions/download-artifact@v4
        with:
          name: jmods-iphoneos-${{ matrix.desktop }}
          path: work/jmods/iphoneos
      - uses: actions/download-artifact@v4
        with:
          name: jmods-iphonesimulator-${{ matrix.desktop }}
          path: work/jmods/iphonesimulator

      - name: Download build JDK (jlink)
        run: |
          source sources.env
          mkdir -p work/semeru/extract
          curl -fsSL --retry 3 -o work/semeru/semeru.tar.gz "$SEMERU_JDK_URL"
          expected="$(curl -fsSL --retry 3 "$SEMERU_JDK_SHA256_URL" | awk '{print $1}')"
          actual="$(shasum -a 256 work/semeru/semeru.tar.gz | awk '{print $1}')"
          [[ "$expected" == "$actual" ]] || { echo "Semeru checksum mismatch" >&2; exit 1; }
          tar -xzf work/semeru/semeru.tar.gz -C work/semeru/extract
          java="$(find work/semeru/extract -maxdepth 6 -type f -path '*/bin/java' -print -quit)"
          [[ -n "$java" ]] || { echo "Semeru archive has no JDK" >&2; exit 1; }
          echo "SEMERU_HOME=$(cd "$(dirname "$java")/.." && pwd)" >> "$GITHUB_ENV"

      - name: Package runtime frameworks
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || version=21.0.13
          for sdk in iphoneos iphonesimulator; do
            scripts/package-runtime.sh --sdk $sdk --jmods work/jmods/$sdk \
              --jlink "$SEMERU_HOME/bin/jlink" --out out/runtime --version "$version"
          done

      - name: Create XCFrameworks
        run: |
          scripts/make-xcframeworks.sh --device out/runtime/iphoneos/Frameworks \
            --simulator out/runtime/iphonesimulator/Frameworks --out Artifacts/XCFrameworks

      - name: Package standalone SwiftPM SDK
        run: |
          scripts/package-sdk.sh Artifacts/XCFrameworks "Artifacts/OpenJ9-iOS-${{ matrix.desktop }}.zip"
          mkdir -p work/sdk-smoke
          ditto -x -k "Artifacts/OpenJ9-iOS-${{ matrix.desktop }}.zip" work/sdk-smoke

      - name: Simulator smoke test
        env:
          HOST_JAVA_HOME: ${{ env.SEMERU_HOME }}
        run: |
          args=()
          [[ "${{ matrix.desktop }}" != core ]] || args+=(--disable-java-desktop)
          work/sdk-smoke/OpenJ9/scripts/smoke-test-simulator.sh --out "$PWD/work/smoke" "${args[@]}"

      - name: Simulator benchmark
        if: ${{ matrix.desktop == 'headless' && github.event_name == 'workflow_dispatch' && inputs.benchmark }}
        env:
          HOST_JAVA_HOME: ${{ env.SEMERU_HOME }}
        run: |
          for pass in 1 2; do
            reverse=0
            [[ $pass == 2 ]] && reverse=1
            OPENJ9_BENCH_REVERSE=$reverse OPENJ9_BENCH_WARMUP=1000 OPENJ9_BENCH_REPS=7 \
              work/sdk-smoke/OpenJ9/scripts/smoke-test-simulator.sh --bench --out "$PWD/work/bench-$pass"
          done

      - name: Upload SwiftPM SDK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenJ9-iOS-${{ matrix.desktop }}-xcframeworks
          path: |
            Artifacts/OpenJ9-iOS-${{ matrix.desktop }}.zip
            Artifacts/OpenJ9-iOS-${{ matrix.desktop }}.zip.sha256
          if-no-files-found: warn

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.desktop }}
          path: |
            work/smoke
            work/bench-*
          if-no-files-found: ignore

  zero-baseline:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.zero_baseline }}
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install autoconf make

      - name: Fetch Zero-capable JDK sources
        run: |
          curl -fsSL --retry 3 -o work-jdk21u.tar.gz \
            "https://github.com/openjdk/jdk21u/archive/refs/tags/jdk-21.0.13+9.tar.gz"
          tar -xzf work-jdk21u.tar.gz

      - name: Download boot JDK
        run: |
          source sources.env
          mkdir -p work/semeru/extract
          curl -fsSL --retry 3 -o work/semeru/semeru.tar.gz "$SEMERU_JDK_URL"
          tar -xzf work/semeru/semeru.tar.gz -C work/semeru/extract
          java="$(find work/semeru/extract -maxdepth 6 -type f -path '*/bin/java' -print -quit)"
          [[ -n "$java" ]] || { echo "Semeru archive has no JDK" >&2; exit 1; }
          echo "BOOT_JDK=$(cd "$(dirname "$java")/.." && pwd)" >> "$GITHUB_ENV"

      - name: Build HotSpot Zero (macOS arm64)
        run: |
          cd jdk21u-jdk-21.0.13+9
          bash configure --with-jvm-variants=zero --with-boot-jdk="$BOOT_JDK" \
            --with-debug-level=release --with-native-debug-symbols=none \
            --disable-warnings-as-errors --with-jobs="$(sysctl -n hw.ncpu)"
          make jdk-image LOG=warn

      - name: Run benchmark baseline
        run: |
          mkdir -p work/zero-classes
          "$BOOT_JDK/bin/javac" --release 21 -d work/zero-classes Samples/HelloJava/java/src/Bench.java
          ZERO_BIN="$(find "$PWD/jdk21u-jdk-21.0.13+9/build" -maxdepth 4 -type f -path '*/images/jdk/bin/java' -print -quit)"
          [[ -n "$ZERO_BIN" ]] || { echo "no built java" >&2; exit 1; }
          "$ZERO_BIN" -version
          "$ZERO_BIN" -Xint -XX:-UseCompressedOops -XX:-UseCompressedClassPointers \
            -cp work/zero-classes Bench | tee work/zero-bench.txt

      - name: Upload baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-baseline
          path: work/zero-bench.txt
          if-no-files-found: ignore

  release:
    needs: [package, swift-api]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OpenJ9-iOS-*-xcframeworks
          path: work/release
      - uses: actions/download-artifact@v4
        with:
          name: OpenJ9-iOS-source
          path: work/release/source
      - name: Publish verified SDKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "OpenJ9 Java 21 for iOS. Download either SwiftPM SDK, unzip, and add OpenJ9 as a local Xcode package. Interpreter-only; physical-device execution and App Store approval are not certified." \
            work/release/*/*.zip work/release/*/*.sha256 work/release/source/*.tar.gz
