name: HelloZero
options:
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SUPPORTED_PLATFORMS: iphonesimulator
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The static HotSpot archives carry their own JNI entry points; the app must
    # keep every object they contain.
    DEAD_CODE_STRIPPING: NO
targets:
  HelloZero:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # Generated by scripts/bench-zero-sim.sh: -force_load for each archive, the
    # frameworks the JVM needs, and no dead-code stripping.
    configFiles:
      Debug: zero-runtime.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openj9.ios.HelloZero
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY[sdk=iphonesimulator*]: "-"
    preBuildScripts:
      - name: Compile Bench jar
        script: |
          set -euo pipefail
          HOST_JAVA_HOME="${HOST_JAVA_HOME:-${JAVA_HOME:-$(/usr/libexec/java_home -v 21)}}"
          mkdir -p "$DERIVED_FILE_DIR/bench-classes"
          "$HOST_JAVA_HOME/bin/javac" --release 21 -encoding UTF-8 \
            -d "$DERIVED_FILE_DIR/bench-classes" "$SRCROOT/../HelloJava/java/src/Bench.java"
          "$HOST_JAVA_HOME/bin/jar" --create --file "$DERIVED_FILE_DIR/Bench.jar" \
            -C "$DERIVED_FILE_DIR/bench-classes" .
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Bundle Zero runtime
        script: |
          set -euo pipefail
          : "${ZERO_RUNTIME:?ZERO_RUNTIME must point at the packaged HotSpot Zero runtime}"
          APP="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$APP"
          # java.home is <bundle>/lib for a statically linked HotSpot.
          rm -rf "$APP/lib"
          cp -R "$ZERO_RUNTIME/lib" "$APP/lib"
          cp "$DERIVED_FILE_DIR/Bench.jar" "$APP/Bench.jar"
        basedOnDependencyAnalysis: false
schemes:
  HelloZero:
    build:
      targets:
        HelloZero: all
    run:
      config: Debug
